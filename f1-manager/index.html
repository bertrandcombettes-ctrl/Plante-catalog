<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 Manager Solo</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--tx:#e8eaf0;--mut:#8b93a5;--acc:#e10600;--ok:#2fbf71;--warn:#f5a623}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.full{grid-column:1/-1}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}
button.alt{background:#2a2f3a}button:disabled{opacity:.4;cursor:not-allowed}
input{background:#0f1115;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:8px;font:inherit}
table{width:100%;border-collapse:collapse}td,th{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500}td.n,th.n{text-align:right}
tr.me td{color:var(--acc);font-weight:600}
.bar{height:6px;background:#2a2f3a;border-radius:3px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.mut{color:var(--mut)}.log{max-height:260px;overflow:auto;font-size:13px}.log p{margin:3px 0}
.event{border-color:var(--warn)}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[ri(0,a.length-1)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

const TEAM_NAMES=["Vortex Racing","Scuderia Rossa","Silver Arrow","Aurora GP","Titan Motorsport","Nordic Speed","Phoenix Racing","Blue Comet","Apex Dynamics"];
const FIRST=["Luca","Max","Théo","Oscar","Carlos","Yuki","Pierre","Nico","Alex","Lando","Felipe","Kimi","Jules","Mika","Sven","Raoul"];
const LAST=["Moretti","Duval","Hartmann","Okada","Reyes","Lindqvist","Costa","Novak","Bianchi","Ferrand","Keller","Santos","Rivière","Kowalski","Ito","Marchetti"];
const TRACKS=["Bahreïn","Australie","Japon","Monaco","Espagne","Canada","Autriche","Silverstone","Spa","Monza","Singapour","Abou Dhabi"];
const POINTS=[25,18,15,12,10,8,6,4,2,1];
const PRIZE=[30,26,22,19,16,13,10,8,6,4];
const STATS={eng:"Moteur",aer:"Aérodynamique",rel:"Fiabilité"};
const SAVE="f1manager.v1";

let S=null;

function newDriver(skill,team){return {id:Math.random().toString(36).slice(2,8),name:pick(FIRST)+" "+pick(LAST),skill,pts:0,team}}
function newGame(name){
  const teams=[],drivers=[];
  const mk=(n,i,player)=>{
    const base=player?58:78-i*2.5;
    const t={id:i,name:n,player,eng:0,aer:0,rel:0,budget:player?70:ri(20,60),pts:0,sponsor:player?14:ri(12,20),drivers:[]};
    for(const k of Object.keys(STATS))t[k]=clamp(Math.round(base+rnd(-6,6)),35,95);
    for(let j=0;j<2;j++){const d=newDriver(clamp(Math.round((player?70-j*5:84-i*2.5-j*4)+rnd(-3,3)),50,95),i);t.drivers.push(d.id);drivers.push(d)}
    teams.push(t);
  };
  mk(name||"Mon Écurie",0,true);
  TEAM_NAMES.forEach((n,i)=>mk(n,i+1,false));
  S={season:1,round:0,teams,drivers,log:[],event:null,eventDone:false,mods:{},relMod:0,wet:false,free:[],over:false,last:null};
  addLog(`Bienvenue chez ${teams[0].name} ! Saison 1, ${TRACKS.length} courses.`);
  save();
}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{S=JSON.parse(localStorage.getItem(SAVE))}catch(e){S=null}}
function addLog(t){S.log.unshift(`S${S.season} · ${t}`);S.log.length=Math.min(S.log.length,60)}
const me=()=>S.teams[0];
const drv=id=>S.drivers.find(d=>d.id===id);
const tdrivers=t=>t.drivers.map(drv);

/* ---------- Améliorations ---------- */
const upCost=v=>15+Math.floor(v/5);
function upgrade(k){
  const t=me(),c=upCost(t[k]);
  if(t.budget<c)return;
  t.budget-=c;const g=t[k]>=88?ri(1,2):ri(2,5);t[k]=Math.min(99,t[k]+g);
  addLog(`${STATS[k]} amélioré (+${g}) pour ${c} M$.`);save();render();
}
function gamble(k){
  const t=me();if(t.budget<20)return;
  t.budget-=20;
  if(Math.random()<.5){const g=ri(6,10);t[k]=Math.min(99,t[k]+g);addLog(`R&D risquée réussie : ${STATS[k]} +${g} !`)}
  else addLog(`R&D risquée sur ${STATS[k]} : échec, 20 M$ perdus.`);
  save();render();
}

/* ---------- Événements aléatoires ---------- */
const EVENTS=[
 {id:"sponsor",title:"Offre de sponsor",txt:()=>"Une marque propose 40 M$ mais exige des apparitions promo : votre pilote n°1 sera moins concentré.",
  ch:[{l:"Accepter (+40 M$)",fn:()=>{me().budget+=40;S.mods[me().drivers[0]]=(S.mods[me().drivers[0]]||0)-4;return"Sponsor accepté, +40 M$."}},
      {l:"Refuser",fn:()=>"Offre refusée."}]},
 {id:"poach",title:"Ingénieur débauché",txt:()=>"Un rival veut débaucher votre ingénieur en chef.",
  ch:[{l:"Le retenir (-25 M$)",fn:()=>{me().budget-=25;return"Ingénieur retenu pour 25 M$."}},
      {l:"Le laisser partir (+15 M$, -4 aéro)",fn:()=>{me().budget+=15;me().aer=Math.max(30,me().aer-4);return"L'ingénieur part, l'aéro en souffre."}}]},
 {id:"windtunnel",title:"Découverte en soufflerie",txt:()=>"Vos ingénieurs ont repéré une piste prometteuse.",
  ch:[{l:"Tout miser (-10 M$, 50 % : +8 aéro / sinon -3)",fn:()=>{me().budget-=10;if(Math.random()<.5){me().aer=Math.min(99,me().aer+8);return"Jackpot : +8 aéro !"}me().aer-=3;return"Fausse piste : -3 aéro."}},
      {l:"Prudence (+2 aéro)",fn:()=>{me().aer=Math.min(99,me().aer+2);return"Petit gain : +2 aéro."}}]},
 {id:"sick",title:"Pilote malade",txt:()=>{const d=drv(S.event.d);return`${d.name} est malade avant la course.`},
  ch:[{l:"Le faire courir (-12 de forme)",fn:()=>{S.mods[S.event.d]=(S.mods[S.event.d]||0)-12;return"Il courra diminué."}},
      {l:"Pilote de réserve (-8 M$)",fn:()=>{const d=drv(S.event.d);S.mods[S.event.d]=Math.min(0,62-d.skill);me().budget-=8;return"Le réserviste prend le volant."}}]},
 {id:"fine",title:"Amende de la FIA",txt:()=>"Infraction technique détectée : amende de 12 M$.",
  ch:[{l:"Payer (-12 M$)",fn:()=>{me().budget-=12;return"Amende payée."}},
      {l:"Faire appel (40 % : 0 / sinon -20 M$)",fn:()=>{if(Math.random()<.4)return"Appel gagné, pas d'amende !";me().budget-=20;return"Appel perdu : -20 M$."}}]},
 {id:"engine",title:"Souci moteur aux essais",txt:()=>"Un problème de fiabilité est détecté sur la voiture.",
  ch:[{l:"Corriger (-15 M$, +3 fiabilité)",fn:()=>{me().budget-=15;me().rel=Math.min(99,me().rel+3);return"Problème corrigé."}},
      {l:"Ignorer (gros risque d'abandon)",fn:()=>{S.relMod=-20;return"Vous croisez les doigts…"}}]},
 {id:"weather",title:"Pluie annoncée",txt:()=>"La météo prévoit des averses. Des pneus pluie spécifiques réduiraient l'aléa pour vos pilotes.",
  ch:[{l:"Préparer (-6 M$)",fn:()=>{me().budget-=6;S.wet=true;return"Setup pluie préparé."}},{l:"Ne rien faire",fn:()=>"On verra bien."}]},
 {id:"grant",title:"Subvention régionale",txt:()=>"La région offre 20 M$ pour votre usine.",ch:[{l:"Encaisser",fn:()=>{me().budget+=20;return"+20 M$ !"}}]},
];
function rollEvent(){
  if(S.eventDone||S.event)return;
  S.eventDone=true;
  if(Math.random()<.55){
    const e=pick(EVENTS);S.event={id:e.id,d:pick(me().drivers)};
  }
}
function choose(i){
  const e=EVENTS.find(x=>x.id===S.event.id);
  addLog(`${e.title} : ${e.ch[i].fn()}`);
  S.event=null;save();render();
}

/* ---------- Course ---------- */
function race(){
  if(S.event||S.over)return;
  const track=TRACKS[S.round];
  const rain=Math.random()<.25,sc=Math.random()<.35;
  const entries=S.drivers.map(d=>{
    const t=S.teams[d.team],mine=t.player;
    const noise=((rain?9:5)+(sc?2:0))*(mine&&S.wet?.7:1);
    const rel=t.rel+(mine?S.relMod:0);
    const perf=t.eng*.35+t.aer*.35+(d.skill+(S.mods[d.id]||0))*.3+gauss()*noise;
    const dnf=Math.random()<.02+Math.max(0,100-rel)/100*.22;
    return{d,t,perf,dnf};
  });
  const fin=entries.filter(e=>!e.dnf).sort((a,b)=>b.perf-a.perf);
  const out=entries.filter(e=>e.dnf);
  const order=[...fin,...out];
  fin.forEach((e,i)=>{if(i<POINTS.length){e.d.pts+=POINTS[i];e.t.pts+=POINTS[i]}});
  // finances
  const rank=[...S.teams].sort((a,b)=>b.pts-a.pts);
  S.teams.forEach(t=>{
    const sal=tdrivers(t).reduce((s,d)=>s+Math.round(d.skill/12),0);
    t.budget+=t.sponsor+PRIZE[rank.indexOf(t)]-8-sal;
  });
  // bots améliorent leur voiture
  S.teams.slice(1).forEach(t=>{
    if(t.budget>35){const k=Object.keys(STATS).sort((a,b)=>t[a]-t[b])[0];t[k]=Math.min(99,t[k]+ri(2,4));t.budget-=25}
  });
  const w=fin[0];
  addLog(`🏁 ${track}${rain?" 🌧":""}${sc?" (safety car)":""} : victoire de ${w.d.name} (${w.t.name}).`);
  const mine=order.map((e,i)=>({e,i})).filter(x=>x.e.t.player);
  mine.forEach(({e,i})=>addLog(e.dnf?`💥 ${e.d.name} abandonne.`:`${e.d.name} termine P${i+1}.`));
  S.last={track,rain,sc,order:order.map(e=>({n:e.d.name,t:e.t.name,p:e.t.player,dnf:e.dnf}))};
  S.mods={};S.relMod=0;S.wet=false;S.eventDone=false;
  S.round++;
  if(me().budget<-50){S.over=true;addLog("💸 Faillite ! L'écurie est liquidée.")}
  else if(S.round>=TRACKS.length)endSeason();
  save();render();
}
function endSeason(){
  const ct=[...S.teams].sort((a,b)=>b.pts-a.pts),dr=[...S.drivers].sort((a,b)=>b.pts-a.pts);
  addLog(`🏆 Fin de saison ${S.season} ! Pilotes : ${dr[0].name}. Constructeurs : ${ct[0].name}. Vous : ${ct.indexOf(me())+1}ᵉ.`);
  S.drivers.forEach(d=>{d.skill=clamp(d.skill+ri(-3,4),45,98);d.pts=0});
  S.teams.forEach(t=>t.pts=0);
  S.season++;S.round=0;
  S.free=[0,1,2].map(()=>newDriver(ri(58,86),-1));
}
function hire(fid,slot){
  const f=S.free.find(x=>x.id===fid),t=me(),fee=Math.round(f.skill/2);
  if(t.budget<fee)return;
  const old=drv(t.drivers[slot]);
  t.budget-=fee;f.team=0;
  S.drivers=S.drivers.filter(d=>d.id!==old.id);S.drivers.push(f);
  t.drivers[slot]=f.id;S.free=S.free.filter(x=>x.id!==fid);
  addLog(`Recrutement de ${f.name} (${f.skill}) à la place de ${old.name} pour ${fee} M$.`);save();render();
}

/* ---------- Rendu ---------- */
const bar=v=>`<div class="bar"><i style="width:${v}%"></i></div>`;
function render(){
  const app=document.getElementById("app");
  if(!S){
    app.innerHTML=`<div class="card"><h1>🏎️ F1 Manager Solo</h1><p class="mut">Dirigez votre écurie face à 9 bots, avec événements aléatoires.</p>
    <div class="row"><input id="nm" placeholder="Nom de votre écurie" maxlength="24"><button onclick="newGame(document.getElementById('nm').value.trim());render()">Commencer</button></div></div>`;
    return;
  }
  const t=me();
  if(S.over){
    app.innerHTML=`<div class="card"><h1>Fin de partie</h1><p>${S.log[0]}</p><button onclick="localStorage.removeItem('${SAVE}');S=null;render()">Nouvelle partie</button></div>`;
    return;
  }
  rollEvent();
  const ev=S.event&&EVENTS.find(e=>e.id===S.event.id);
  const ctab=[...S.teams].sort((a,b)=>b.pts-a.pts);
  const dtab=[...S.drivers].sort((a,b)=>b.pts-a.pts).slice(0,10);
  let h=`<header><h1>🏎️ ${t.name}</h1><div>Saison ${S.season} · course ${S.round+1}/${TRACKS.length} · <b>${t.budget} M$</b></div></header><div class="grid">`;
  h+=`<div class="card full ${ev?"event":""}">`;
  if(ev){
    h+=`<h2>⚠️ ${ev.title}</h2><p>${ev.txt()}</p><div class="btns">${ev.ch.map((c,i)=>`<button class="alt" onclick="choose(${i})">${c.l}</button>`).join("")}</div>`;
  }else{
    h+=`<h2>Prochain Grand Prix</h2><div class="row"><b>${TRACKS[S.round]}</b><button onclick="race()">Lancer la course</button></div>`;
  }
  h+=`</div>`;
  h+=`<div class="card"><h2>Votre voiture</h2>${Object.keys(STATS).map(k=>`<div class="row"><span style="width:110px">${STATS[k]}</span>${bar(t[k])}<b>${t[k]}</b>
    <button class="alt" ${t.budget<upCost(t[k])?"disabled":""} onclick="upgrade('${k}')">+ ${upCost(t[k])}M</button>
    <button class="alt" ${t.budget<20?"disabled":""} onclick="gamble('${k}')" title="50 % de chance de gagner +6 à +10">🎲 20M</button></div>`).join("")}
    <p class="mut">Revenus/course : sponsors ${t.sponsor} M$ + prime de classement − frais.</p></div>`;
  h+=`<div class="card"><h2>Vos pilotes</h2>${tdrivers(t).map(d=>`<div class="row"><span>${d.name}</span><span class="mut">niveau ${d.skill}</span><b>${d.pts} pts</b></div>`).join("")}</div>`;
  if(S.round===0&&S.free.length){
    h+=`<div class="card full"><h2>Marché des pilotes</h2><p class="mut">Remplacez l'un de vos pilotes (coût = niveau/2 M$).</p>${S.free.map(f=>`<div class="row"><span>${f.name} · niveau ${f.skill}</span><span>${tdrivers(t).map((d,i)=>`<button class="alt" ${t.budget<Math.round(f.skill/2)?"disabled":""} onclick="hire('${f.id}',${i})">Remplace ${d.name} (${Math.round(f.skill/2)}M)</button>`).join(" ")}</span></div>`).join("")}</div>`;
  }
  if(S.last){
    h+=`<div class="card"><h2>Dernière course · ${S.last.track}${S.last.rain?" 🌧":""}</h2><table>${S.last.order.slice(0,10).map((o,i)=>`<tr class="${o.p?"me":""}"><td>${i+1}</td><td>${o.n}</td><td class="mut">${o.t}</td></tr>`).join("")}</table></div>`;
  }
  h+=`<div class="card"><h2>Constructeurs</h2><table>${ctab.map((x,i)=>`<tr class="${x.player?"me":""}"><td>${i+1}</td><td>${x.name}</td><td class="n">${x.pts}</td></tr>`).join("")}</table></div>`;
  h+=`<div class="card"><h2>Pilotes</h2><table>${dtab.map((d,i)=>`<tr class="${S.teams[d.team].player?"me":""}"><td>${i+1}</td><td>${d.name}</td><td class="mut">${S.teams[d.team].name}</td><td class="n">${d.pts}</td></tr>`).join("")}</table></div>`;
  h+=`<div class="card full"><h2>Journal</h2><div class="log">${S.log.map(l=>`<p>${l}</p>`).join("")}</div>
    <div class="btns"><button class="alt" onclick="if(confirm('Tout recommencer ?')){localStorage.removeItem('${SAVE}');S=null;render()}">Nouvelle partie</button></div></div></div>`;
  app.innerHTML=h;
  save();
}
load();render();
</script>
</body>
</html>
